<html>
	<head>
		<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
		<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
		<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
	</head>
	<body>
		<div id="root">aaa</div>
		<script type="text/babel">
			const root = ReactDOM.createRoot(document.getElementById("root"));
			root.render(<h1>Hello, world!</h1>);

			const PV = (props) => {
				const name = props.name;
				const value = props.value;
				return (
					<h1>
						{name}:{value}
					</h1>
				);
			};

			const ws = new WebSocket("ws://localhost:8080");
			ws.onopen = () => {
				console.log("opened");
				// ws.send("MONITOR TGT_LWS2:Tnk_TE1710D:T -d DBR_CTRL_DOUBLE");
				// ws.send("MONITOR FE:Scope_2:Ch1 -d DBR_CTRL_DOUBLE");
				ws.send("MONITOR val1 -d DBR_CTRL_DOUBLE");
			};
			ws.onmessage = (event) => {
				console.log("received: %s", JSON.parse(event.data.toString()));
				const data = event.data;
				const dataObj = JSON.parse(event.data);
				const value = dataObj.value;
				const name = dataObj.channelName;
				root.render(<PV value={value} name={name}></PV>);
			};
			// ws.onclose = () => {
			// 	ws.send("CLOSE_ALL_CHANNELS");
			// };
			// window.addEventListener("beforeunload", (event) => {
			// 	ws.send("CLOSE_ALL_CHANNELS");
			// });
		</script>
		<!-- <script  type="text/babel" src="./abc.js"></script> -->
	</body>
</html>
